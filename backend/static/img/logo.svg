<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Stylized Letter 'P' -->
  <!-- Vertical stem of P -->
  <rect x="34" y="28" width="8" height="64" rx="4" fill="url(#cyanGrad)" filter="url(#cyanGlow)"/>
  
  <!-- Upper loop of P -->
  <path d="M42 32 H68 C80 32, 88 40, 88 52 C88 64, 80 72, 68 72 H42" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#cyanGlow)"/>
        
  <!-- Pulse Waveform intersecting through loop and stem -->
  <path d="M22 64 L44 64 L50 50 L58 78 L66 58 L72 64 L98 64" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95"/>
        
  <!-- Glowing Pulse Point -->
  <circle cx="66" cy="58" r="3.5" fill="#00f2fe" filter="url(#cyanGlow)"/>
</svg>
