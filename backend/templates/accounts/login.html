<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PulseAPI Observability</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/pulseapi.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0d152a 0%, #060913 70%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: rgba(14, 21, 37, 0.85);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <img src="/static/img/logo.svg" alt="PulseAPI" width="60" height="60" class="mb-3">
    <h3 class="fw-bold text-white mb-1">PulseAPI</h3>
    <p class="text-muted small">Every endpoint. Every millisecond. One clear picture.</p>
  </div>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} small py-2 mb-3 border-0">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">

    <div class="mb-3">
      <label class="pulse-label">Username</label>
      <input type="text" name="username" class="form-control pulse-input" required autofocus placeholder="Enter your username">
    </div>

    <div class="mb-4">
      <label class="pulse-label">Password</label>
      <input type="password" name="password" class="form-control pulse-input" required placeholder="Enter password">
    </div>

    <button type="submit" class="btn btn-pulse-cyan w-100 py-2 mb-3">
      Sign In
    </button>

    <div class="text-center small text-muted">
      Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Create Account</a>
    </div>
  </form>
</div>

</body>
</html>
