services:
  db:
    image: postgres:16-alpine
    container_name: pulseapi_postgres
    environment:
      POSTGRES_DB: pulseapi
      POSTGRES_USER: pulseapi
      POSTGRES_PASSWORD: pulseapipass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseapi -d pulseapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseapi_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: pulseapi_web
    command: >
      sh -c "python manage.py migrate &&
             gunicorn pulseapi.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=pulseapi-production-secret-observability-engine-2026
      - ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=pulseapi
      - DB_USER=pulseapi
      - DB_PASSWORD=pulseapipass
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SSRF_ALLOW_PRIVATE_IPS=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: pulseapi_celery_worker
    command: celery -A pulseapi worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app/backend
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=pulseapi
      - DB_USER=pulseapi
      - DB_PASSWORD=pulseapipass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SSRF_ALLOW_PRIVATE_IPS=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: pulseapi_celery_beat
    command: celery -A pulseapi beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=pulseapi
      - DB_USER=pulseapi
      - DB_PASSWORD=pulseapipass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
